[project]
name = "llm-playground"
version = "0.1.0"
description = "A small playground for trying out various LLMs from Jupyter notebooks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.30.0",
    "ipykernel",
    "jupyter",
    "litellm",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_playground"]
